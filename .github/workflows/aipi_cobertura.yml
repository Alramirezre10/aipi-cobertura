name: AIPI Cobertura

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
      ONEDRIVE_INPUT_INSTITUCIONAL_8H: ${{ secrets.INPUT_FOLDER_INSTITUCIONAL_8H }}
      ONEDRIVE_INPUT_JARDINES_INTEGRALES: ${{ secrets.INPUT_FOLDER_JARDINES_INTEGRALES }}
      ONEDRIVE_OUTPUT_FOLDER: ${{ secrets.OUTPUT_FOLDER }}
      INPUT_FILE_DICCIONARIO: ${{ secrets.INPUT_FILE_DICCIONARIO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run process
        run: python app/report_runner.py
        
      - name: Notificar error por Gmail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ Error en GitHub Actions - AIPI Cobertura"
          to: ${{ secrets.GMAIL_USER }}
          from: ${{ secrets.GMAIL_USER }}
          body: |
            Falló el proceso automático de AIPI Cobertura.

            Repositorio: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Ejecución: #${{ github.run_number }}
            Rama: ${{ github.ref_name }}

            Ver detalle:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
